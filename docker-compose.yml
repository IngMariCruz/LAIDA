services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_PATH: /app/data/laida.db
    volumes:
      - ./bd:/app/data

  bot:
    profiles:
      - bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      BOT_DB_PATH: /app/data/laida.db
      BOT_CONVERSATIONS_DIR: /app/data/conversations
    volumes:
      - ./bd:/app/data
    restart: unless-stopped
