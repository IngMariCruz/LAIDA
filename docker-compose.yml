services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app          # código fuente montado en vivo
      - /app/node_modules        # preserva node_modules del contenedor
      - ./bd:/app/data
    environment:
      NODE_ENV: development
      DB_PATH: /app/data/laida.db
      WATCHPACK_POLLING: "true"  # necesario en Windows para detectar cambios
    env_file:
      - .env

  bot:
    profiles:
      - bot
    build:
      context: ./bot
      dockerfile: Dockerfile
    environment:
      BOT_DB_PATH: /app/data/laida.db
      BOT_CONVERSATIONS_DIR: /app/data/conversations
    volumes:
      - ./bd:/app/data
    restart: unless-stopped
