          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      bots:
                        type: array
                        items:
                          $ref: '#/components/schemas/Bot'
                  - type: object
                    properties:
                      usuarios:
                        type: array
                        items:
                          $ref: '#/components/schemas/UsuarioPublico'
        '400':
          description: Parámetro requerido faltante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
