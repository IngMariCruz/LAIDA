  # ══════════════════════════════════════════════════════════════════
  # NOTIFICACIONES
  # ══════════════════════════════════════════════════════════════════
  /notificaciones:
    get:
      tags: [Notificaciones]
      summary: Obtener notificaciones del usuario autenticado
      parameters:
        - name: action
          in: query
          schema:
            type: string
            enum: [count, unread]
          description: |
            - `count`: retorna `{ count: number }` con el total no leído
            - `unread`: retorna solo notificaciones no leídas
            - (sin parámetro): retorna todas las notificaciones
      responses:
        '200':
          description: Notificaciones
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      count:
                        type: integer
                  - type: array
                    items:
                      $ref: '#/components/schemas/Notificacion'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags: [Notificaciones]
      summary: Crear notificación / marcar todas leídas / solicitar ejecución de campañas
      description: |
        Según el campo `action`:
        - `mark_all_read`: marca todas las notificaciones del usuario como leídas
        - `request_run_campaigns`: notifica a los super_admins para que ejecuten campañas pendientes (solo managers)
        - (sin action): crea una notificación manual (solo super_admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [mark_all_read, request_run_campaigns]
                tipo:
                  type: string
                  enum: [nuevo_lead, sistema]
                  description: Requerido si no hay action
                titulo:
                  type: string
                  description: Requerido si no hay action
                mensaje:
                  type: string
                  description: Requerido si no hay action
                lead_id:
                  type: integer
                  nullable: true
                bot_id:
                  type: integer
                  nullable: true
                from:
                  type: string
                  description: Nombre del solicitante para `request_run_campaigns`
      responses:
        '200':
          description: Acción ejecutada exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  notified:
                    type: integer
                    description: Solo para request_run_campaigns
        '201':
          description: Notificación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          description: Campos requeridos faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notificaciones/{id}:
    patch:
      tags: [Notificaciones]
      summary: Marcar notificación como leída
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificación marcada como leída
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notificacion'
        '400':
          description: ID inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: No autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notificación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Notificaciones]
      summary: Eliminar notificación (solo super_admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Notificación eliminada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '403':
          description: Solo super_admin puede eliminar notificaciones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Notificación no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
