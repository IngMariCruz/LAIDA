              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /clientes/import:
    post:
      tags: [Clientes]
      summary: Importar clientes desde Excel (.xlsx)
      description: |
        Acepta un archivo Excel en Base64. Las columnas reconocidas son:
        cedula/dni/id, nombre, apellido, correo/email, telefono/telephone/phone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, marcaId]
              properties:
                filename:
                  type: string
                  example: "clientes.xlsx"
                data:
                  type: string
                  format: byte
                  description: Archivo Excel codificado en Base64
                marcaId:
                  type: integer
      responses:
        '200':
          description: Importación completada
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  inserted:
                    type: integer
                  skipped:
                    type: integer
                  errors:
                    type: array
                    items:
                      type: string
        '400':
          description: Datos faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Error procesando el archivo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

